<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>potatoq dashboard</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="logo.svg" alt="" width="32" height="32">
      <div>
        <h1>potatoq <span id="app-name" class="muted"></span></h1>
        <p class="muted small"><span id="broker"></span><span id="read-only" class="pill" hidden>read-only</span></p>
      </div>
    </div>
    <div class="status">
      <span id="updated" class="muted small">Connecting…</span>
      <button id="pause" type="button" class="ghost">Pause</button>
    </div>
  </header>

  <p id="error" class="banner" role="alert" hidden></p>

  <main>
    <section class="tiles" aria-label="Summary">
      <div class="tile"><span class="label">Live workers</span><span id="t-workers" class="value">–</span></div>
      <div class="tile"><span class="label">Running</span><span id="t-running" class="value">–</span></div>
      <div class="tile"><span class="label">Waiting</span><span id="t-waiting" class="value">–</span></div>
      <div class="tile" id="tile-dead"><span class="label">Dead letters</span><span id="t-dead" class="value">–</span></div>
    </section>

    <section class="card">
      <h2>Find a task</h2>
      <form id="lookup" class="lookup">
        <input id="lookup-id" name="id" placeholder="Task ID" autocomplete="off" spellcheck="false" required>
        <button type="submit">Look up</button>
      </form>
    </section>

    <section class="card">
      <h2>Workers</h2>
      <div class="scroll"><table>
        <thead><tr><th>Worker</th><th>Queues</th><th class="num">Concurrency</th><th>Running</th><th class="num">Heartbeat</th></tr></thead>
        <tbody id="workers"></tbody>
      </table></div>
    </section>

    <div class="pair">
      <section class="card">
        <h2>Queues</h2>
        <div class="scroll"><table>
          <thead><tr><th>Queue</th><th class="num">Waiting</th></tr></thead>
          <tbody id="queues"></tbody>
        </table></div>
      </section>

      <section class="card">
        <h2>Periodic tasks</h2>
        <div class="scroll"><table>
          <thead><tr><th>Entry</th><th>Schedule</th><th class="num">Next run</th><th class="num">Last sent</th></tr></thead>
          <tbody id="schedule"></tbody>
        </table></div>
      </section>
    </div>

    <section class="card">
      <h2>Dead letters <span id="dead-note" class="muted small"></span></h2>
      <div class="scroll"><table>
        <thead><tr><th>Task</th><th>ID</th><th>Queue</th><th class="num">Died</th><th>Reason</th><th></th></tr></thead>
        <tbody id="dead"></tbody>
      </table></div>
    </section>
  </main>

  <dialog id="task">
    <form method="dialog" class="dialog-head">
      <h2 id="task-title">Task</h2>
      <button class="ghost" aria-label="Close">✕</button>
    </form>
    <dl id="task-fields"></dl>
    <pre id="task-traceback" hidden></pre>
    <div class="dialog-actions">
      <button id="delete" type="button" class="outline-danger" hidden>Delete</button>
      <button id="retry" type="button" hidden>Retry</button>
      <button id="revoke" type="button" class="danger" hidden>Revoke</button>
    </div>
  </dialog>
</body>
</html>
