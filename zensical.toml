# Documentation site: `uv run --group docs zensical serve`
[project]
site_name = "potatoq"
site_description = "A Celery-compatible Python task queue with production-ready defaults and backend-native Redis, RabbitMQ, Postgres and SQLite brokers."
site_url = "https://anze3db.github.io/potatoq/"
repo_url = "https://github.com/anze3db/potatoq"
repo_name = "anze3db/potatoq"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Anže Pečar · MIT License"
extra_css = ["assets/stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
    "getting-started/choosing-a-broker.md",
  ] },
  { "Guide" = [
    "guide/tasks.md",
    "guide/calling-and-results.md",
    "guide/retries-and-failures.md",
    "guide/workflows.md",
    "guide/periodic-tasks.md",
    "guide/workers.md",
    "guide/transactions.md",
    "guide/testing.md",
  ] },
  { "Integrations" = [
    "integrations/django.md",
    "integrations/django-tasks.md",
    "integrations/flask.md",
    "integrations/fastapi.md",
    "integrations/sqlalchemy.md",
  ] },
  { "Brokers" = [
    "brokers/postgres.md",
    "brokers/redis.md",
    "brokers/rabbitmq.md",
    "brokers/sqlite.md",
  ] },
  { "Migrating from Celery" = "migrating-from-celery.md" },
  { "Changelog" = "changelog.md" },
  { "Wishlist" = "wishlist.md" },
  { "Reference" = [
    "reference/settings.md",
    "reference/cli.md",
    "reference/api.md",
  ] },
  { "Design" = [
    "design/defaults.md",
    "design/internals.md",
    { "Research" = [
      "design/research/celery-pain-points.md",
      "design/research/ruby-queues.md",
      "design/research/python-alternatives.md",
    ] },
  ] },
]

[project.theme]
language = "en"
logo = "assets/images/logo.svg"
favicon = "assets/images/logo.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/anze3db/potatoq"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/potatoq/"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
members_order = "source"
merge_init_into_class = true
filters = ["!^_", "!^[A-Z_]+$"]
heading_level = 2

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
