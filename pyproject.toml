[project]
name = "potatoq"
# CalVer: YY.N = the Nth release of 20YY (26.1, 26.2, ..., 27.1). Bumped by scripts/release.py.
version = "26.1"
description = "A Celery-compatible task queue with production-ready defaults and backend-native Redis, RabbitMQ, Postgres and SQLite brokers."
readme = "README.md"
authors = [{ name = "Anže Pečar", email = "anze@pecar.me" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["celery", "task queue", "jobs", "background tasks", "redis", "rabbitmq", "postgres", "sqlite", "django"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.2"]
rabbitmq = ["pika>=1.3"]
all = ["redis>=5.0", "psycopg[binary]>=3.2", "pika>=1.3"]

[project.scripts]
potatoq = "potatoq.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "redis>=5.0",
    "psycopg>=3.2",
    "pika>=1.3",
    "django>=5.2",
    "flask>=3.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]
docs = [
    "mkdocstrings-python>=2",
    "zensical>=0.0.68",
]

# psycopg's compiled wheels don't exist for free-threaded Python (3.13t/3.14t/3.15t):
# there, sync with `--no-group binary` and the pure-Python psycopg uses the system libpq.
binary = ["psycopg-binary>=3.2"]

[tool.uv]
default-groups = ["dev", "binary"]

[build-system]
requires = ["uv_build>=0.8.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF012", "B904"]
