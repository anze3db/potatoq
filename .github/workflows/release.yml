# Publishes a release when a "Release YY.N" PR (label: release) is merged:
#   tag -> build (sdist + wheel) -> PyPI via trusted publishing (with PEP 740
#   attestations) -> GitHub release with the CHANGELOG.md section and the dists.
# Can be re-run by hand (workflow_dispatch) for a version that is already in CHANGELOG.md.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - id: version
        run: |
          version=$(uv version --short)
          uv run --no-project python scripts/release.py notes "$version" > /dev/null  # must have a changelog entry
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; re-running the release."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$VERSION" -f "sha=$(git rev-parse HEAD)"
          fi

  build:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Check the distributions
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          uvx twine check --strict dist/*
          # The built wheel must import and report the tagged version.
          uv run --isolated --no-project --with dist/*.whl python -c \
            "import os, potatoq, sys; sys.exit(potatoq.__version__ != os.environ['VERSION'])"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [tag, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/potatoq/${{ needs.tag.outputs.version }}/
    permissions:
      id-token: write # trusted publishing + attestations; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [tag, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.tag.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          python3 scripts/release.py notes "$VERSION" > notes.md
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md
            gh release upload "$VERSION" dist/* --clobber
          else
            pre=""
            case "$VERSION" in *a*) pre="--prerelease" ;; esac  # alphas: 26.1a1
            gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md --verify-tag $pre
          fi
