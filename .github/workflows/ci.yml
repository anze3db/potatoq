name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run ruff check src tests benchmarks scripts
      - run: uv run ruff format --check src tests benchmarks scripts
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: potatoq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.3-management
        ports: ["5672:5672", "15672:15672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      POTATOQ_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/potatoq_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # psycopg-binary has no free-threaded wheels: use pure psycopg + the runner's libpq.
      - run: uv sync --python ${{ matrix.python }} ${{ endsWith(matrix.python, 't') && '--no-group binary' || '' }}
      # -n 4: most tests wait on real brokers and worker processes, so they run in
      # parallel well (each uses its own queues, key prefix and schema).
      - name: Tests
        if: matrix.python != '3.13'
        run: uv run --no-sync --python ${{ matrix.python }} pytest -q -n 4
      - name: Tests with coverage (must stay at 100%)
        if: matrix.python == '3.13'
        run: |
          uv run --no-sync --python 3.13 coverage run -m pytest -q -n 4
          uv run --no-sync --python 3.13 coverage combine
          uv run --no-sync --python 3.13 coverage report

  django-6-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --with 'django>=6.0,<6.1' pytest -q tests/test_django.py tests/test_django_tasks.py tests/test_cov_contrib_django.py
